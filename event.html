<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - Moriya Ultimate Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --fundo-imagem: url('images/backgroundsE.png');
            --fundo-opacidade: 1;
        }
        
        body {
            padding: 20px;
            min-height: 100vh;
            position: relative;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-image: var(--fundo-imagem);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            opacity: var(--fundo-opacidade);
        }
        
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #1a1a2e;
            opacity: 0.25;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #16213e;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            border: 1px solid #2a2a4a;
        }

        /* ============================================================
           CABEÇALHO
        ============================================================ */
        .header {
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 2px solid #2a2a4a;
            margin-bottom: 25px;
        }

        .header .event-badge {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        /* ============================================================
           TÍTULO ARCO-ÍRIS ANIMADO
        ============================================================ */
        .rainbow-title {
            font-size: 28px;
            font-weight: 700;
            display: inline-block;
            background: linear-gradient(
                to right,
                #ff0000, #ff7700, #ffff00, #00ff00, 
                #0000ff, #8b00ff, #ff00ff, #ff0000
            );
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: arco-iris-move 2s linear infinite;
            filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.6));
        }

        @keyframes arco-iris-move {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .header .subtitle {
            color: #85c1e9;
            font-size: 14px;
            margin-top: 8px;
            opacity: 0.8;
        }

        /* ============================================================
           FILTROS DE REGRAS
        ============================================================ */
        .regras-filtros {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: rgba(26, 26, 46, 0.5);
            border-radius: 10px;
            border: 1px solid #2a2a4a;
        }

        .regras-filtros .filtro-linha {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .regras-filtros .filtro-label {
            color: #85c1e9;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-right: 4px;
        }

        .regras-filtros .filtro-btn {
            padding: 6px 16px;
            border: 2px solid transparent;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            background: transparent;
            color: #c0c0c0;
        }

        .regras-filtros .filtro-btn:hover {
            transform: scale(1.05);
        }

        /* ===== CORES DOS BOTÕES DE REGRA ===== */
        .regras-filtros .filtro-btn.todas {
            border-color: #7f8c8d;
            color: #7f8c8d;
        }

        .regras-filtros .filtro-btn.todas:hover,
        .regras-filtros .filtro-btn.todas.active {
            background: #7f8c8d;
            color: white;
            border-color: #7f8c8d;
        }

        .regras-filtros .filtro-btn.mvm-oficial {
            border-color: #2980b9;
            color: #2980b9;
        }

        .regras-filtros .filtro-btn.mvm-oficial:hover,
        .regras-filtros .filtro-btn.mvm-oficial.active {
            background: #2980b9;
            color: white;
            border-color: #2980b9;
        }

        .regras-filtros .filtro-btn.potato-oficial {
            border-color: #8B4513;
            color: #8B4513;
        }

        .regras-filtros .filtro-btn.potato-oficial:hover,
        .regras-filtros .filtro-btn.potato-oficial.active {
            background: #8B4513;
            color: white;
            border-color: #8B4513;
        }

        .regras-filtros .filtro-btn.regras-moriya {
            border-color: #27ae60;
            color: #27ae60;
        }

        .regras-filtros .filtro-btn.regras-moriya:hover,
        .regras-filtros .filtro-btn.regras-moriya.active {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
        }

        /* ============================================================
           FILTRO DROPDOWN DE OPERAÇÕES
        ============================================================ */
        .regras-filtros .filtro-label-operacao {
            color: #85c1e9;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .regras-filtros .filtro-dropdown {
            position: relative;
            display: inline-block;
        }

        .regras-filtros .filtro-dropdown .dropdown-btn {
            padding: 6px 16px;
            border: 2px solid #3498db;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            background: transparent;
            color: #3498db;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .regras-filtros .filtro-dropdown .dropdown-btn:hover {
            background: #3498db;
            color: white;
            transform: scale(1.05);
        }

        .regras-filtros .filtro-dropdown .dropdown-btn .arrow {
            font-size: 10px;
            transition: transform 0.3s ease;
        }

        .regras-filtros .filtro-dropdown .dropdown-btn .arrow.aberto {
            transform: rotate(180deg);
        }

        .regras-filtros .filtro-dropdown .dropdown-menu {
            display: none;
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 10px;
            padding: 6px 0;
            min-width: 220px;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .regras-filtros .filtro-dropdown .dropdown-menu.aberto {
            display: block;
        }

        .regras-filtros .filtro-dropdown .dropdown-menu .dropdown-item {
            display: block;
            width: 100%;
            padding: 8px 18px;
            border: none;
            background: transparent;
            color: #c0c0c0;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .regras-filtros .filtro-dropdown .dropdown-menu .dropdown-item:hover {
            background: rgba(52, 152, 219, 0.15);
            color: #85c1e9;
        }

        .regras-filtros .filtro-dropdown .dropdown-menu .dropdown-item.active {
            background: #3498db;
            color: white;
        }

        .regras-filtros .filtro-dropdown .dropdown-menu .dropdown-item .count {
            float: right;
            color: #7f8c8d;
            font-size: 11px;
            background: rgba(255,255,255,0.05);
            padding: 0 8px;
            border-radius: 10px;
        }

        .regras-filtros .filtro-dropdown .dropdown-menu .dropdown-item.active .count {
            color: rgba(255,255,255,0.7);
        }

        .regras-filtros .filtro-dropdown .dropdown-menu::-webkit-scrollbar {
            width: 4px;
        }

        .regras-filtros .filtro-dropdown .dropdown-menu::-webkit-scrollbar-track {
            background: rgba(26, 26, 46, 0.3);
            border-radius: 2px;
        }

        .regras-filtros .filtro-dropdown .dropdown-menu::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 2px;
        }

        /* ============================================================
           EFEITO ARCO-ÍRIS PARA EVENTOS
        ============================================================ */
        .rainbow-glow {
            animation: arco-iris-move 3s linear infinite !important;
            background: linear-gradient(
                to right,
                #ff0000, #ff7700, #ffff00, #00ff00, 
                #0000ff, #8b00ff, #ff00ff, #ff0000
            ) !important;
            background-size: 300% 100% !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
            font-weight: 700 !important;
            display: inline-block !important;
            filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.6)) !important;
        }

        /* ============================================================
           LISTA DE EVENTOS
        ============================================================ */
        .evento-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #2a2a4a;
            transition: all 0.3s ease;
            position: relative;
            overflow: visible;
        }

        .evento-card:hover {
            border-color: #e94560;
        }

        .evento-card .evento-titulo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a4a;
        }

        .evento-card .evento-titulo h2 {
            color: #e0e0e0;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ============================================================
           MEDALHA DO EVENTO COM LEGENDA (EXPANDE PARA LADO)
        ============================================================ */
        .evento-card .medalha-container {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 5;
            width: 70px;
            height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            overflow: visible;
        }
        
        .evento-card .medalha-container .medalha-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));
            animation: medalhaGlow 2s ease-in-out infinite alternate;
            border-radius: 0;
            background: transparent;
            transition: transform 0.3s ease;
        }

        .evento-card .medalha-container:hover .medalha-img {
            transform: scale(1.1);
        }
        
        /* ===== GLOW DA MEDALHA ===== */
        @keyframes medalhaGlow {
            0% {
                filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.4));
                transform: scale(1);
            }
            100% {
                filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.8));
                transform: scale(1.05);
            }
        }
        
        /* ===== CORES DIFERENTES PARA CADA REGRA ===== */
        .evento-card .medalha-container .medalha-img.mvm-oficial {
            filter: drop-shadow(0 0 15px rgba(41, 128, 185, 0.6));
            animation: medalhaGlowAzul 2s ease-in-out infinite alternate;
        }
        
        .evento-card .medalha-container .medalha-img.potato-oficial {
            filter: drop-shadow(0 0 15px rgba(139, 69, 19, 0.6));
            animation: medalhaGlowMarrom 2s ease-in-out infinite alternate;
        }
        
        .evento-card .medalha-container .medalha-img.regras-moriya {
            filter: drop-shadow(0 0 15px rgba(39, 174, 96, 0.6));
            animation: medalhaGlowVerde 2s ease-in-out infinite alternate;
        }
        
        /* ===== ANIMAÇÕES POR COR ===== */
        @keyframes medalhaGlowAzul {
            0% { filter: drop-shadow(0 0 10px rgba(41, 128, 185, 0.4)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 25px rgba(41, 128, 185, 0.8)); transform: scale(1.05); }
        }
        
        @keyframes medalhaGlowMarrom {
            0% { filter: drop-shadow(0 0 10px rgba(139, 69, 19, 0.4)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 25px rgba(139, 69, 19, 0.8)); transform: scale(1.05); }
        }
        
        @keyframes medalhaGlowVerde {
            0% { filter: drop-shadow(0 0 10px rgba(39, 174, 96, 0.4)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 25px rgba(39, 174, 96, 0.8)); transform: scale(1.05); }
        }

        /* ===== LEGENDA EXPANDE PARA O LADO ===== */
        .evento-card .medalha-container .medalha-legenda {
            position: absolute;
            top: 50%;
            right: calc(100% + 12px);
            transform: translateY(-50%);
            background: rgba(26, 26, 46, 0.95);
            color: #f0f0f0;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid #2a2a4a;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(-50%) translateX(10px);
            transition: all 0.3s ease;
            pointer-events: none;
            backdrop-filter: blur(10px);
            max-width: none;
        }

        .evento-card .medalha-container:hover .medalha-legenda {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }

        /* ===== CORES DA LEGENDA POR REGRA ===== */
        .evento-card .medalha-container .medalha-legenda.mvm-oficial {
            border-color: #2980b9;
            color: #85c1e9;
        }

        .evento-card .medalha-container .medalha-legenda.potato-oficial {
            border-color: #8B4513;
            color: #d4a574;
        }

        .evento-card .medalha-container .medalha-legenda.regras-moriya {
            border-color: #27ae60;
            color: #82e0aa;
        }
        
        /* ===== TAMANHO RESPONSIVO ===== */
        @media (max-width: 600px) {
            .evento-card .medalha-container {
                width: 50px;
                height: 50px;
                top: 5px;
                right: 5px;
            }
            
            .evento-card .medalha-container .medalha-img {
                width: 50px;
                height: 50px;
            }

            .evento-card .medalha-container .medalha-legenda {
                font-size: 8px;
                padding: 2px 8px;
                right: calc(100% + 8px);
            }
        }

        .evento-card .evento-titulo .evento-badge {
            font-size: 12px;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ===== BADGE DE REGRAS ===== */
        .evento-card .regra-badge {
            font-size: 10px;
            padding: 3px 12px;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .regra-badge.mvm-oficial {
            background: #2980b9;
            color: white;
        }

        .regra-badge.potato-oficial {
            background: #8B4513;
            color: white;
        }

        .regra-badge.regras-moriya {
            background: #27ae60;
            color: white;
        }

        /* ===== STATUS ===== */
        .badge-ao-vivo {
            background: #e74c3c;
            color: white;
            animation: glowVermelho 1.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.3);
        }

        @keyframes glowVermelho {
            0% { box-shadow: 0 0 10px rgba(231, 76, 60, 0.3); }
            50% { box-shadow: 0 0 30px rgba(231, 76, 60, 0.8), 0 0 60px rgba(231, 76, 60, 0.3); }
            100% { box-shadow: 0 0 10px rgba(231, 76, 60, 0.3); }
        }

        .badge-ao-vivo .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: piscar 1s ease-in-out infinite;
        }

        @keyframes piscar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .badge-em-breve {
            background: #f39c12;
            color: white;
        }

        .badge-encerrado {
            background: #7f8c8d;
            color: white;
        }

        /* ============================================================
           MAPAS COM STATUS
        ============================================================ */
        .evento-card .mapa-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            margin: 4px 0;
            background: #0f1a2e;
            border-radius: 6px;
            border-left: 3px solid #e94560;
            transition: all 0.3s ease;
        }

        .evento-card .mapa-item:hover {
            background: #16213e;
            transform: translateX(5px);
        }

        .evento-card .mapa-item .mapa-nome {
            color: #e0e0e0;
            font-size: 14px;
        }

        .evento-card .mapa-item .mapa-wave {
            color: #85c1e9;
            font-size: 12px;
            background: #0f3460;
            padding: 2px 12px;
            border-radius: 12px;
        }

        .evento-card .sem-mapas {
            color: #7f8c8d;
            text-align: center;
            padding: 15px;
            font-style: italic;
        }

        /* ============================================================
           STATUS DOS MAPAS - CORES
        ============================================================ */
        .mapa-item.status-completo {
            border-left-color: #27ae60 !important;
            background: rgba(39, 174, 96, 0.15) !important;
        }

        .mapa-item.status-completo .mapa-nome {
            color: #27ae60 !important;
        }

        .mapa-item.status-completo .mapa-wave {
            background: rgba(39, 174, 96, 0.2) !important;
            color: #27ae60 !important;
        }

        .mapa-item.status-incompleto {
            border-left-color: #f39c12 !important;
            background: rgba(243, 156, 18, 0.15) !important;
        }

        .mapa-item.status-incompleto .mapa-nome {
            color: #f39c12 !important;
        }

        .mapa-item.status-incompleto .mapa-wave {
            background: rgba(243, 156, 18, 0.2) !important;
            color: #f39c12 !important;
        }

        .mapa-item.status-corrompido {
            border-left-color: #e74c3c !important;
            background: rgba(231, 76, 60, 0.15) !important;
        }

        .mapa-item.status-corrompido .mapa-nome {
            color: #e74c3c !important;
        }

        .mapa-item.status-corrompido .mapa-wave {
            background: rgba(231, 76, 60, 0.2) !important;
            color: #e74c3c !important;
        }

        .mapa-item.status-completo:hover {
            background: rgba(39, 174, 96, 0.25) !important;
        }

        .mapa-item.status-incompleto:hover {
            background: rgba(243, 156, 18, 0.25) !important;
        }

        .mapa-item.status-corrompido:hover {
            background: rgba(231, 76, 60, 0.25) !important;
        }

        /* ===== STATUS BADGE ===== */
        .mapa-status-badge {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge-completo {
            background: #27ae60;
            color: white;
        }

        .status-badge-incompleto {
            background: #f39c12;
            color: white;
        }

        .status-badge-corrompido {
            background: #e74c3c;
            color: white;
        }

        /* ===== STATUS CANÔNICO ===== */
        .mapa-item.status-canonico {
            border-left-color: #9b59b6 !important;
            background: rgba(155, 89, 182, 0.15) !important;
        }

        .mapa-item.status-canonico .mapa-nome {
            color: #bb86fc !important;
        }

        .mapa-item.status-canonico .mapa-wave {
            background: rgba(155, 89, 182, 0.2) !important;
            color: #bb86fc !important;
        }

        .mapa-item.status-canonico:hover {
            background: rgba(155, 89, 182, 0.25) !important;
        }

        .status-badge-canonico {
            background: #9b59b6;
            color: white;
        }

        /* ============================================================
           VÍDEO
        ============================================================ */
        .video-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #2a2a4a;
        }

        .video-section .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #0f3460;
        }

        .video-section .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ============================================================
           BOTÃO VOLTAR
        ============================================================ */
        .btn-voltar {
            display: inline-block;
            background: #0f3460;
            color: #85c1e9;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            margin-top: 10px;
            border: 1px solid #2a2a4a;
            text-align: center;
        }

        .btn-voltar:hover {
            background: #1a1a4e;
            transform: scale(1.02);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
        }

        /* ============================================================
           LEGENDA DE STATUS (FIXA - DIREITA)
        ============================================================ */
        .legenda-status {
            position: fixed;
            bottom: 20px;
            right: 20px;

        // ============================================================
        // FUNÇÃO PARA EXTRAIR OPERAÇÕES DOS EVENTOS
        // ============================================================
        function extrairOperacoes() {
            const operacoes = new Map();
            
            eventos.forEach(evento => {
                let nomeOperacao = null;
                
                // Tenta pegar do campo 'conjunto'
                if (evento.conjunto) {
                    nomeOperacao = evento.conjunto;
                }
                // Se não tiver, tenta do nome da medalha
                else if (evento.medalhaNome) {
                    nomeOperacao = evento.medalhaNome.replace(/[⚔️🏅📜]/g, '').trim();
                }
                // Se não tiver nada, usa "Sem Operação"
                else {
                    nomeOperacao = 'Sem Operação';
                }
                
                if (!operacoes.has(nomeOperacao)) {
                    operacoes.set(nomeOperacao, []);
                }
                operacoes.get(nomeOperacao).push(evento);
            });
            
            return operacoes;
        }

            sortedOperacoes.forEach(([nome, eventosLista]) => {

        // ============================================================
        // FUNÇÃO PARA DETERMINAR STATUS DO EVENTO
        // ============================================================
        function getStatusEvento(dataInicio, dataFim) {
            const agora = new Date();
        
            const inicio = new Date(dataInicio);
            const fim = new Date(dataFim);
        
            if (agora >= inicio && agora <= fim) {
                return 'ao-vivo';
            } else if (agora < inicio) {
                return 'em-breve';
            } else {
                return 'encerrado';
            }
        }

        // ============================================================
        // FUNÇÃO PARA FORMATAR DATA E HORA
        // ============================================================
        function formatarDataHora(data) {
            const d = new Date(data);
            return d.toLocaleDateString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
        }

        function formatarHora(data) {
            const d = new Date(data);
            return d.toLocaleTimeString('pt-BR', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // ============================================================
        // FUNÇÃO PARA EXTRAIR NOME DO ARQUIVO
        // ============================================================
        function extrairNomeArquivo(caminho) {
            const partes = caminho.split('/');
            const arquivo = partes[partes.length - 1];
            return arquivo.replace(/\.[^/.]+$/, '').replace(/_/g, ' ');
        }

        // ============================================================
        // FUNÇÃO PARA EXTRAIR NOME DO CONJUNTO
        // ============================================================
        function extrairConjunto(nome) {
            let nomeLimpo = nome.replace(/[0-9#]+$/, '').trim();
            nomeLimpo = nomeLimpo.replace(/[^\w\s]/g, '').trim();
            
            if (nomeLimpo.includes('Operação')) {
                const match = nomeLimpo.match(/(Operação\s+[^\d]+)/i);
                if (match) return match[1].trim();
            }
            if (nomeLimpo.includes('Low Tier')) {
                const match = nomeLimpo.match(/(Low\s+Tier\s+[^\d]+)/i);
                if (match) return match[1].trim();
            }
            if (nomeLimpo.includes('DELICIA Tier')) {
                const match = nomeLimpo.match(/(DELICIA\s+Tier\s+[^\d]+)/i);
                if (match) return match[1].trim();
            }
            if (nomeLimpo.includes('Padrão Tier')) {
                const match = nomeLimpo.match(/(Padrão\s+Tier\s+[^\d]+)/i);
                if (match) return match[1].trim();
            }
            return nomeLimpo || 'Outras Medalhas';
        }

        // ============================================================
        // GERAR LEGENDA DE MEDALHAS (COM ACCORDION - FECHADO POR PADRÃO)
        // ============================================================
        function gerarLegendaMedalhas() {
            const container = document.getElementById('medalhasList');
            
            const medalhasMap = new Map();
            
            eventos.forEach(evento => {
                if (evento.medalha && evento.medalha.trim() !== '') {
                    const key = evento.medalha;
                    if (!medalhasMap.has(key)) {
                        medalhasMap.set(key, {
                            caminho: evento.medalha,
                            nome: evento.medalhaNome || extrairNomeArquivo(evento.medalha),
                            credito: evento.medalhaCredito || 'Desconhecido',
                            regra: evento.regra || '',
                            conjunto: evento.conjunto || extrairConjunto(evento.medalhaNome || extrairNomeArquivo(evento.medalha))
                        });
                    }
                }
            });
            
            if (medalhasMap.size === 0) {
                container.innerHTML = `
                    <div style="color: #7f8c8d; font-size: 12px; text-align: center; padding: 5px 0;">
                        Nenhuma medalha cadastrada
                    </div>
                `;
                return;
            }
            
            const conjuntos = {};
            medalhasMap.forEach((medalha) => {
                const nomeConjunto = medalha.conjunto || 'Outras Medalhas';
                if (!conjuntos[nomeConjunto]) {
                    conjuntos[nomeConjunto] = [];
                }
                conjuntos[nomeConjunto].push(medalha);
            });
            
            let html = '';
            const conjuntoKeys = Object.keys(conjuntos);
            conjuntoKeys.forEach((nomeConjunto, index) => {
                const medalhas = conjuntos[nomeConjunto];
                // ===== TODOS OS CONJUNTOS COMEÇAM FECHADOS =====
                const isAberto = false;  // <-- ALTERADO PARA false
                
                html += `
                    <div class="conjunto-item">
                        <div class="conjunto-header" data-conjunto="${index}">
                            📁 ${nomeConjunto}
                            <span class="toggle-icon ${isAberto ? 'aberto' : ''}">▼</span>
                        </div>
                        <div class="conjunto-content ${isAberto ? 'aberto' : ''}">
                `;
                
                medalhas.forEach((medalha) => {
                    const regraClass = medalha.regra || '';
                    html += `
                        <div class="legenda-item">
                            <img src="${medalha.caminho}" class="medalha-preview ${regraClass}" alt="${medalha.nome}">
                            <div class="medalha-info">
                                <span class="medalha-nome">🏅 ${medalha.nome}</span>
                                <span class="medalha-credito">🎨 <strong>Criador(a):</strong> ${medalha.credito}</span>
                            </div>
                        </div>
                    `;
                });
                
                html += `
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            
            document.querySelectorAll('.conjunto-header').forEach(header => {
                header.addEventListener('click', function() {
                    const content = this.nextElementSibling;
                    const icon = this.querySelector('.toggle-icon');
                    
                    if (content.classList.contains('aberto')) {
                        content.classList.remove('aberto');
                        icon.classList.remove('aberto');
                        icon.textContent = '▼';
                    } else {
                        content.classList.add('aberto');
                        icon.classList.add('aberto');
                        icon.textContent = '▼';
                    }
                });
            });
            
            const titulo = document.querySelector('.legenda-medalhas .legenda-titulo');
            if (titulo) {
                titulo.addEventListener('click', function() {
                    const contents = document.querySelectorAll('.conjunto-content');
                    const icons = document.querySelectorAll('.toggle-icon');
                    const todosAbertos = Array.from(contents).every(c => c.classList.contains('aberto'));
                    
                    contents.forEach((content, i) => {
                        if (todosAbertos) {
                            content.classList.remove('aberto');
                            icons[i].classList.remove('aberto');
                            icons[i].textContent = '▼';
                        } else {
                            content.classList.add('aberto');
                            icons[i].classList.add('aberto');
                            icons[i].textContent = '▼';
                        }
                    });
                });
            }
        }

                            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                                <span class="regra-badge ${regraClass}">${regraLabel}</span>
                                <span style="color: #85c1e9; font-size: 12px;">
                                    📅 ${dataInicioFormatada} ${horaInicio} - ${dataFimFormatada} ${horaFim}
                                </span>
                                <span class="evento-badge ${badgeClass}">
                                    ${badgeIcon} ${badgeText}
                                </span>
                            </div>
                        </div>
                        ${mapasHtml}
                        ${videoHtml}
                    </div>
                `;
            });
        
            container.innerHTML = html;
        }

        // ============================================================
        // FILTRO DE REGRAS
        // ============================================================
        document.getElementById('regrasFiltros').addEventListener('click', function(e) {
            const btn = e.target.closest('.filtro-btn');
            if (!btn) return;

            // Verifica se é um botão de regra
            if (btn.dataset.regra === 'todas' || 
                btn.dataset.regra === 'mvm-oficial' || 
                btn.dataset.regra === 'potato-oficial' || 
                btn.dataset.regra === 'regras-moriya') {
                
                document.querySelectorAll('.filtro-btn.todas, .filtro-btn.mvm-oficial, .filtro-btn.potato-oficial, .filtro-btn.regras-moriya')
                    .forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                regraAtual = btn.dataset.regra;
                renderizarEventos();
                console.log(`🎮 Filtro de regra: ${regraAtual}`);
                return;
            }
        });

        // ============================================================
        // INICIALIZAR
        // ============================================================
        renderizarEventos();
        gerarLegendaMedalhas();
        gerarDropdownOperacoes();

        console.log('✅ Eventos carregados!');
        console.log(`📅 ${eventos.length} eventos`);
        eventos.forEach(e => {
            const status = getStatusEvento(e.dataInicio, e.dataFim);
            const rainbow = e.rainbow === true ? '🌈' : '⬜';
            console.log(`  ${rainbow} ${e.nome} → ${status} (${e.regra || 'sem regra'})`);
        });
    </script>

</body>
</html>
