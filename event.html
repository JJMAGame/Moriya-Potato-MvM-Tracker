<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - Moriya Ultimate Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --fundo-imagem: url('images/backgroundsE.png');
            --fundo-opacidade: 1;
        }
        
        body {
            padding: 20px;
            min-height: 100vh;
            position: relative;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-image: var(--fundo-imagem);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            opacity: var(--fundo-opacidade);
        }
        
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #1a1a2e;
            opacity: 0.25;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #16213e;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            border: 1px solid #2a2a4a;
        }

        /* ============================================================
           CABEÇALHO
        ============================================================ */
        .header {
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 2px solid #2a2a4a;
            margin-bottom: 25px;
        }

        .header .event-badge {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        /* ============================================================
           TÍTULO ARCO-ÍRIS ANIMADO
        ============================================================ */
        .rainbow-title {
            font-size: 28px;
            font-weight: 700;
            display: inline-block;
            background: linear-gradient(
                to right,
                #ff0000, #ff7700, #ffff00, #00ff00, 
                #0000ff, #8b00ff, #ff00ff, #ff0000
            );
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: arco-iris-move 2s linear infinite;
            filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.6));
        }

        @keyframes arco-iris-move {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .header .subtitle {
            color: #85c1e9;
            font-size: 14px;
            margin-top: 8px;
            opacity: 0.8;
        }

        /* ============================================================
           FILTROS DE REGRAS
        ============================================================ */
        .regras-filtros {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: rgba(26, 26, 46, 0.5);
            border-radius: 10px;
            border: 1px solid #2a2a4a;
            justify-content: center;
        }

        .regras-filtros .filtro-label {
            color: #85c1e9;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-right: 4px;
        }

        .regras-filtros .filtro-btn {
            padding: 6px 16px;
            border: 2px solid transparent;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            background: transparent;
            color: #c0c0c0;
        }

        .regras-filtros .filtro-btn:hover {
            transform: scale(1.05);
        }

        /* ===== CORES DOS BOTÕES ===== */
        .regras-filtros .filtro-btn.todas {
            border-color: #7f8c8d;
            color: #7f8c8d;
        }

        .regras-filtros .filtro-btn.todas:hover,
        .regras-filtros .filtro-btn.todas.active {
            background: #7f8c8d;
            color: white;
            border-color: #7f8c8d;
        }

        .regras-filtros .filtro-btn.mvm-oficial {
            border-color: #2980b9;
            color: #2980b9;
        }

        .regras-filtros .filtro-btn.mvm-oficial:hover,
        .regras-filtros .filtro-btn.mvm-oficial.active {
            background: #2980b9;
            color: white;
            border-color: #2980b9;
        }

        .regras-filtros .filtro-btn.potato-oficial {
            border-color: #8B4513;
            color: #8B4513;
        }

        .regras-filtros .filtro-btn.potato-oficial:hover,
        .regras-filtros .filtro-btn.potato-oficial.active {
            background: #8B4513;
            color: white;
            border-color: #8B4513;
        }

        .regras-filtros .filtro-btn.regras-moriya {
            border-color: #27ae60;
            color: #27ae60;
        }

        .regras-filtros .filtro-btn.regras-moriya:hover,
        .regras-filtros .filtro-btn.regras-moriya.active {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
        }

        /* ============================================================
           EFEITO ARCO-ÍRIS PARA EVENTOS
        ============================================================ */
        .rainbow-glow {
            animation: arco-iris-move 3s linear infinite !important;
            background: linear-gradient(
                to right,
                #ff0000, #ff7700, #ffff00, #00ff00, 
                #0000ff, #8b00ff, #ff00ff, #ff0000
            ) !important;
            background-size: 300% 100% !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
            font-weight: 700 !important;
            display: inline-block !important;
            filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.6)) !important;
        }

        /* ============================================================
           LISTA DE EVENTOS
        ============================================================ */
        .evento-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #2a2a4a;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .evento-card:hover {
            border-color: #e94560;
        }

        .evento-card .evento-titulo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a4a;
        }

        .evento-card .evento-titulo h2 {
            color: #e0e0e0;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .evento-card .evento-titulo .evento-badge {
            font-size: 12px;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ===== BADGE DE REGRAS ===== */
        .evento-card .regra-badge {
            font-size: 10px;
            padding: 3px 12px;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .regra-badge.mvm-oficial {
            background: #2980b9;
            color: white;
        }

        .regra-badge.potato-oficial {
            background: #8B4513;
            color: white;
        }

        .regra-badge.regras-moriya {
            background: #27ae60;
            color: white;
        }

        /* ===== STATUS ===== */
        .badge-ao-vivo {
            background: #e74c3c;
            color: white;
            animation: glowVermelho 1.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.3);
        }

        @keyframes glowVermelho {
            0% { box-shadow: 0 0 10px rgba(231, 76, 60, 0.3); }
            50% { box-shadow: 0 0 30px rgba(231, 76, 60, 0.8), 0 0 60px rgba(231, 76, 60, 0.3); }
            100% { box-shadow: 0 0 10px rgba(231, 76, 60, 0.3); }
        }

        .badge-ao-vivo .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: piscar 1s ease-in-out infinite;
        }

        @keyframes piscar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .badge-em-breve {
            background: #f39c12;
            color: white;
        }

        .badge-encerrado {
            background: #7f8c8d;
            color: white;
        }

        /* ============================================================
           MAPAS COM STATUS
        ============================================================ */
        .evento-card .mapa-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            margin: 4px 0;
            background: #0f1a2e;
            border-radius: 6px;
            border-left: 3px solid #e94560;
            transition: all 0.3s ease;
        }

        .evento-card .mapa-item:hover {
            background: #16213e;
            transform: translateX(5px);
        }

        .evento-card .mapa-item .mapa-nome {
            color: #e0e0e0;
            font-size: 14px;
        }

        .evento-card .mapa-item .mapa-wave {
            color: #85c1e9;
            font-size: 12px;
            background: #0f3460;
            padding: 2px 12px;
            border-radius: 12px;
        }

        .evento-card .sem-mapas {
            color: #7f8c8d;
            text-align: center;
            padding: 15px;
            font-style: italic;
        }

           STATUS DOS MAPAS - CORES
        ============================================================ */
        .mapa-item.status-completo {
            border-left-color: #27ae60 !important;
            background: rgba(39, 174, 96, 0.15) !important;
        }

        .mapa-item.status-completo .mapa-nome {
            color: #27ae60 !important;
        }

        .mapa-item.status-completo .mapa-wave {

        }

        .mapa-item.status-incompleto {
            border-left-color: #f39c12 !important;
            background: rgba(243, 156, 18, 0.15) !important;
        }

        .mapa-item.status-incompleto .mapa-nome {
            color: #f39c12 !important;
        }

        .mapa-item.status-incompleto .mapa-wave {
            background: rgba(243, 156, 18, 0.2) !important;
            color: #f39c12 !important;
        }

        .mapa-item.status-corrompido {
            border-left-color: #e74c3c !important;
            background: rgba(231, 76, 60, 0.15) !important;
        }

        .mapa-item.status-corrompido .mapa-nome {
            color: #e74c3c !important;
        }

        .mapa-item.status-corrompido .mapa-wave {
            background: rgba(231, 76, 60, 0.2) !important;
            color: #e74c3c !important;
        }

        .mapa-item.status-completo:hover {
            background: rgba(39, 174, 96, 0.25) !important;
        }

        .mapa-item.status-incompleto:hover {
            background: rgba(243, 156, 18, 0.25) !important;
        }

        .mapa-item.status-corrompido:hover {
            background: rgba(231, 76, 60, 0.25) !important;
        }

        .mapa-status-badge {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge-completo {
            background: #27ae60;
            color: white;
        }

        .status-badge-incompleto {
            background: #f39c12;
            color: white;
        }

        .status-badge-corrompido {
            background: #e74c3c;
            color: white;
        }

           VÍDEO
        ============================================================ */
        .video-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #2a2a4a;
        }

        .video-section .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #0f3460;
        }

        .video-section .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ============================================================
           BOTÃO VOLTAR
        ============================================================ */
        .btn-voltar {
            display: inline-block;
            background: #0f3460;
            color: #85c1e9;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;

            margin-top: 10px;
            border: 1px solid #2a2a4a;
            text-align: center;
        }

        .btn-voltar:hover {
            background: #1a1a4e;

        }

        .footer {
            text-align: center;
            margin-top: 20px;
        }

        /* ============================================================
           LEGENDA DE STATUS (FIXA)
        ============================================================ */
        .legenda-status {

            bottom: 20px;
            right: 20px;

            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 15px 18px;

            min-width: 140px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;

        .legenda-status:hover {
            transform: scale(1.02);
            border-color: #e94560;
        }

        .legenda-titulo {
            color: #e0e0e0;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 1px solid #2a2a4a;
            padding-bottom: 8px;
        }

        .legenda-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 0;
        }

        .legenda-cor {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .legenda-texto {
            color: #c0c0c0;
            font-size: 13px;
            flex: 1;
        }

        .legenda-badge {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* ============================================================
           RESPONSIVO
        ============================================================ */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .rainbow-title {
                font-size: 20px;
            }

            .evento-card {
                padding: 15px;
            }

            .evento-card .evento-titulo {
                flex-direction: column;
                align-items: flex-start;
            }

            .evento-card .mapa-item {
                flex-wrap: wrap;
                gap: 8px;
            }

            .regras-filtros {
                gap: 6px;
                padding: 10px 12px;
            }

            .regras-filtros .filtro-btn {
                font-size: 10px;
                padding: 4px 10px;
            }

            .regras-filtros .filtro-label {
                font-size: 11px;
                width: 100%;
                justify-content: center;
            }

            .btn-voltar {
                display: block;
            }

            .legenda-status {
                bottom: 10px;
                right: 10px;
                padding: 12px 14px;
                min-width: 110px;
            }

            .legenda-titulo {
                font-size: 10px;
            }

            .legenda-texto {
                font-size: 11px;
            }

            .legenda-cor {
                width: 12px;
                height: 12px;
            }
        }
    </style>
</head>

            },
            {
                nome: "Moriya Vs Potato Arquive ( interlúdio - trespasser )",
                dataInicio: "2026-09-25T18:00:00",
                dataFim: "2026-09-26T00:00:00",
                mapas: [
                    { nome: "Steep - Bandwidth Beatdown", wave: "6 Wave", status: " " },
                    { nome: "Condemned - Trespasser", wave: "Unica Wave", status: " " },
                ],
                videoId: "",
                rainbow: true,
                regra: "potato-oficial"
            },
        ];

        // ============================================================
        // FUNÇÃO PARA DETERMINAR STATUS DO EVENTO
        // ============================================================
        function getStatusEvento(dataInicio, dataFim) {
            const agora = new Date(); // Data e hora atual COMPLETA
        
            const inicio = new Date(dataInicio);
            const fim = new Date(dataFim);
        
            // Comparação com horário completo
            if (agora >= inicio && agora <= fim) {
                return 'ao-vivo';
            } else if (agora < inicio) {
                return 'em-breve';
            } else {
                return 'encerrado';
            }
        }

        // ============================================================
        // FUNÇÃO PARA FORMATAR DATA E HORA
        // ============================================================
        function formatarDataHora(data) {
            const d = new Date(data);
            return d.toLocaleDateString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
        }

        function formatarHora(data) {
            const d = new Date(data);
            return d.toLocaleTimeString('pt-BR', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // ============================================================
        // RENDERIZAR EVENTOS COM FILTRO
        // ============================================================
        let regraAtual = 'todas';

        function renderizarEventos() {
            const container = document.getElementById('eventosContainer');

            // ===== FILTRA OS EVENTOS =====
            let eventosFiltrados = eventos;
            if (regraAtual !== 'todas') {
                eventosFiltrados = eventos.filter(e => e.regra === regraAtual);
            }

            if (eventosFiltrados.length === 0) {
                container.innerHTML = `
                    <div style="color: #7f8c8d; text-align: center; padding: 30px;">
                        📭 Nenhum evento encontrado com este filtro
                    </div>
                `;
                return;
            }

            let html = '';
            eventosFiltrados.forEach((evento) => {
                const status = getStatusEvento(evento.dataInicio, evento.dataFim);

                let badgeClass = '';
                let badgeText = '';
                let badgeIcon = '';

                if (status === 'ao-vivo') {
                    badgeClass = 'badge-ao-vivo';
                    badgeText = 'AO VIVO';
                    badgeIcon = '<span class="pulse-dot"></span>';
                } else if (status === 'em-breve') {
                    badgeClass = 'badge-em-breve';
                    badgeText = '📅 EM BREVE';
                    badgeIcon = '';
                } else {
                    badgeClass = 'badge-encerrado';
                    badgeText = '✅ ENCERRADO';
                    badgeIcon = '';
                }

                const tituloClass = evento.rainbow === true ? 'rainbow-glow' : '';
                const tituloIcon = '📌 ';

                // ===== REGRA BADGE =====
                const regraLabels = {
                    'mvm-oficial': '🔵 MvM Oficiais',
                    'potato-oficial': '🟤 Potato Oficiais',
                    'regras-moriya': '🟢 Regras Moriya'
                };
                const regraLabel = regraLabels[evento.regra] || '📋 Sem regra';
                const regraClass = evento.regra || '';

                // ============================================================
                // RENDERIZAR MAPAS COM STATUS
                // ============================================================
                let mapasHtml = '';
                if (evento.mapas.length === 0) {
                    mapasHtml = '<div class="sem-mapas">📭 Nenhum mapa registrado</div>';
                } else {
                    evento.mapas.forEach(mapa => {
                        let statusClass = '';
                        let statusBadge = '';
                        let statusLabel = '';

                        if (mapa.status === 'completo') {
                            statusClass = 'status-completo';
                            statusBadge = 'status-badge-completo';
                            statusLabel = '✅ Completo';
                        } else if (mapa.status === 'incompleto') {
                            statusClass = 'status-incompleto';
                            statusBadge = 'status-badge-incompleto';
                            statusLabel = '⏳ Incompleto';
                        } else if (mapa.status === 'corrompido') {
                            statusClass = 'status-corrompido';
                            statusBadge = 'status-badge-corrompido';
                            statusLabel = '⚠️ Corrompido';
                        }

                        mapasHtml += `
                            <div class="mapa-item ${statusClass}">
                                <span class="mapa-nome">${mapa.nome}</span>
                                <span style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                                    ${mapa.wave ? `<span class="mapa-wave">${mapa.wave}</span>` : ''}
                                    ${statusLabel ? `<span class="mapa-status-badge ${statusBadge}">${statusLabel}</span>` : ''}
                                </span>
                            </div>
                        `;
                    });
                }

                // ============================================================
                // DATAS COM HORÁRIO
                // ============================================================
                const dataInicioFormatada = formatarDataHora(evento.dataInicio);
                const dataFimFormatada = formatarDataHora(evento.dataFim);
                const horaInicio = formatarHora(evento.dataInicio);
                const horaFim = formatarHora(evento.dataFim);

                // Vídeo (se tiver)
                let videoHtml = '';
                if (evento.videoId && evento.videoId.trim() !== '') {
                    videoHtml = `
                        <div class="video-section">
                            <div class="video-wrapper">
                                <iframe
                                    src="https://www.youtube.com/embed/${evento.videoId}"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                    allowfullscreen
                                ></iframe>
                            </div>
                        </div>
                    `;
                }

                html += `
                    <div class="evento-card">
                        <div class="evento-titulo">
                            <h2>
                                <span class="icon">${tituloIcon}</span>
                                <span class="${tituloClass}">${evento.nome}</span>
                            </h2>
                            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                                <span class="regra-badge ${regraClass}">${regraLabel}</span>
                                <span style="color: #85c1e9; font-size: 12px;">
                                    📅 ${dataInicioFormatada} ${horaInicio} - ${dataFimFormatada} ${horaFim}
                                </span>
                                <span class="evento-badge ${badgeClass}">
                                    ${badgeIcon} ${badgeText}
                                </span>
                            </div>
                        </div>
                        ${mapasHtml}
                        ${videoHtml}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================================
        // FILTRO DE REGRAS
        // ============================================================
        document.getElementById('regrasFiltros').addEventListener('click', function(e) {
            const btn = e.target.closest('.filtro-btn');
            if (!btn) return;

            // Remove active de todos
            document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));

            // Adiciona active no clicado
            btn.classList.add('active');

            // Atualiza o filtro
            regraAtual = btn.dataset.regra;

            // Re-renderiza os eventos
            renderizarEventos();

            console.log(`🎮 Filtro: ${regraAtual}`);
        });

        // ============================================================
        // INICIALIZAR
        // ============================================================
        renderizarEventos();

        console.log('✅ Eventos carregados!');
        console.log(`📅 ${eventos.length} eventos`);
        eventos.forEach(e => {
            const status = getStatusEvento(e.dataInicio, e.dataFim);
            const rainbow = e.rainbow === true ? '🌈' : '⬜';
            console.log(`  ${rainbow} ${e.nome} → ${status} (${e.regra || 'sem regra'})`);
        });
    </script>

</body>
</html>
