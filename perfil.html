<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Moriya Ultimate Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --fundo-imagem: url('images/backgrounds.png');
            --fundo-opacidade: 0.6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a2e1a;
            padding: 20px;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-image: var(--fundo-imagem);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            opacity: var(--fundo-opacidade);
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #1a2e1a;
            opacity: 0.55;
        }

        body::-webkit-scrollbar { width: 6px; }
        body::-webkit-scrollbar-track { background: rgba(26, 26, 46, 0.2); border-radius: 3px; }
        body::-webkit-scrollbar-thumb { background: rgba(42, 42, 74, 0.4); border-radius: 3px; }
        body::-webkit-scrollbar-thumb:hover { background: rgba(42, 42, 74, 0.7); }
        body { scrollbar-width: thin; scrollbar-color: rgba(42, 42, 74, 0.4) rgba(26, 26, 46, 0.2); }

        /* ============================================================
           BOTÃO MEDALHA - CANTO INFERIOR DIREITO (FORA DA LIGHTBAR)
        ============================================================ */
        .btn-medalha-flutuante {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 9998;
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            border: 3px solid transparent;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 4px 25px rgba(241, 196, 15, 0.5),
                        0 0 40px rgba(241, 196, 15, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #1a1a2e;
            animation: medalhaPulse 2.5s ease-in-out infinite;
            background-clip: padding-box;
        }
        
        /* ===== BORDA GRADIENTE ANIMADA - SEM MASK ===== */
        .btn-medalha-flutuante::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            z-index: -1;
            background: linear-gradient(135deg, #ffd700, #ff6b00, #ffd700, #ff6b00);
            background-size: 300% 300%;
            animation: medalhaBorderGlow 3s ease-in-out infinite;
        }
        
        @keyframes medalhaBorderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes medalhaPulse {
            0% { transform: scale(1); box-shadow: 0 4px 25px rgba(241, 196, 15, 0.5); }
            50% { transform: scale(1.08); box-shadow: 0 4px 40px rgba(241, 196, 15, 0.8), 0 0 60px rgba(241, 196, 15, 0.3); }
            100% { transform: scale(1); box-shadow: 0 4px 25px rgba(241, 196, 15, 0.5); }
        }
        
        .btn-medalha-flutuante:hover {
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 4px 40px rgba(241, 196, 15, 0.9), 0 0 80px rgba(241, 196, 15, 0.4);
        }
        
        .btn-medalha-flutuante:active {
            transform: scale(0.92);
        }
        
        .btn-medalha-flutuante .tooltip {
            position: absolute;
            bottom: calc(100% + 12px);
            right: 50%;
            transform: translateX(50%) scale(0.9);
            background: rgba(26, 26, 46, 0.95);
            color: #f0f0f0;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid #f1c40f;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .btn-medalha-flutuante:hover .tooltip {
            opacity: 1;
            transform: translateX(50%) scale(1);
        }
        
        /* ===== RESPONSIVO ===== */
        @media (max-width: 768px) {
            .btn-medalha-flutuante {
                width: 50px;
                height: 50px;
                font-size: 24px;
                bottom: 15px;
                right: 15px;
            }
        
            .btn-medalha-flutuante .tooltip {
                font-size: 10px;
                padding: 4px 12px;
                bottom: calc(100% + 8px);
            }
        }
        
        @media (max-width: 480px) {
            .btn-medalha-flutuante {
                width: 44px;
                height: 44px;
                font-size: 20px;
                bottom: 12px;
                right: 12px;
            }
        
            .btn-medalha-flutuante .tooltip {
                display: none;
            }
        }

        /* ============================================================
           CONTAINER
        ============================================================ */
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #2a4a2a;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            border: 1px solid #3a5a3a;
        }

        /* ============================================================
           NAVEGAÇÃO
        ============================================================ */
        .nav-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 2px solid #3a5a3a;
            margin-bottom: 25px;
        }

        .nav-top a {
            color: #85c1e9;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 6px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-top a:hover {
            background: #1a3a1a;
            border-color: #3a5a3a;
            color: #4caf50;
        }

        .nav-top .back-btn {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
        }

        .nav-top .back-btn:hover {
            background: #2ecc71;
            color: white;
        }

        /* ============================================================
           PERFIL
        ============================================================ */
        .perfil-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .perfil-header .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }

        .perfil-header .nome {
            color: #f0f0f0;
            font-size: 28px;
            font-weight: 700;
            margin-top: 12px;
        }

        .perfil-header .descricao {
            color: #b0b0b0;
            font-size: 16px;
            margin-top: 4px;
        }

        .perfil-header .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
            padding: 12px 20px;
            background: rgba(26, 46, 26, 0.3);
            border-radius: 10px;
            border: 1px solid #3a5a3a;
        }

        .perfil-header .stats .stat {
            text-align: center;
        }

        .perfil-header .stats .stat .value {
            color: #ffd700;
            font-size: 24px;
            font-weight: 700;
        }

        .perfil-header .stats .stat .label {
            color: #88bb88;
            font-size: 12px;
        }

        /* ============================================================
           MEDALHAS DO USUÁRIO
        ============================================================ */
        .medalhas-section {
            margin-top: 20px;
        }

        .medalhas-section .section-title {
            color: #f0f0f0;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3a5a3a;
        }

        .medalhas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .medalha-card {
            background: #1a3a1a;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 1px solid #3a5a3a;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .medalha-card:hover {
            border-color: #ffd700;
            transform: translateY(-3px);
        }

        .medalha-card .medalha-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            display: block;
            margin: 0 auto 8px auto;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.15));
        }

        .medalha-card .medalha-nome {
            color: #f0f0f0;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.3;
        }

        .medalha-card .medalha-pontos {
            color: #ffd700;
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
        }

        /* ============================================================
           TARJAS DE RARIDADE NO PERFIL
        ============================================================ */
        .medalha-card .raridade-tarja {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }

        .medalha-card .raridade-tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* ===== CORES DAS RARIDADES ===== */
        .raridade-comum .raridade-tarja { background: #7f8c8d; }
        .raridade-comum .raridade-tag { background: rgba(127, 140, 141, 0.2); color: #bdc3c7; border: 1px solid #7f8c8d; }

        .raridade-incomum .raridade-tarja { background: #2ecc71; }
        .raridade-incomum .raridade-tag { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid #2ecc71; }

        .raridade-rara .raridade-tarja { background: #3498db; }
        .raridade-rara .raridade-tag { background: rgba(52, 152, 219, 0.15); color: #3498db; border: 1px solid #3498db; }

        .raridade-epica .raridade-tarja { background: #9b59b6; }
        .raridade-epica .raridade-tag { background: rgba(155, 89, 182, 0.15); color: #bb86fc; border: 1px solid #9b59b6; }

        .raridade-mitica .raridade-tarja { background: #e74c3c; }
        .raridade-mitica .raridade-tag { background: rgba(231, 76, 60, 0.15); color: #ff6b6b; border: 1px solid #e74c3c; }

        .raridade-lendaria .raridade-tarja { background: #ffd700; }
        .raridade-lendaria .raridade-tag { background: rgba(255, 215, 0, 0.15); color: #ffd700; border: 1px solid #ffd700; }

        .raridade-contrabando .raridade-tarja { background: #e67e22; }
        .raridade-contrabando .raridade-tag { background: rgba(230, 126, 34, 0.15); color: #f39c12; border: 1px solid #e67e22; }

        /* ===== EFEITO GLOW POR RARIDADE ===== */
        .raridade-comum:hover { border-color: #7f8c8d; }
        .raridade-incomum:hover { border-color: #2ecc71; box-shadow: 0 0 20px rgba(46, 204, 113, 0.15); }
        .raridade-rara:hover { border-color: #3498db; box-shadow: 0 0 20px rgba(52, 152, 219, 0.15); }
        .raridade-epica:hover { border-color: #9b59b6; box-shadow: 0 0 20px rgba(155, 89, 182, 0.15); }
        .raridade-mitica:hover { border-color: #e74c3c; box-shadow: 0 0 20px rgba(231, 76, 60, 0.15); }
        .raridade-lendaria:hover { border-color: #ffd700; box-shadow: 0 0 30px rgba(255, 215, 0, 0.2); }
        .raridade-contrabando:hover { border-color: #e67e22; box-shadow: 0 0 20px rgba(230, 126, 34, 0.15); }

        /* ============================================================
           SEM MEDALHAS
        ============================================================ */
        .sem-medalhas {
            color: #88bb88;
            text-align: center;
            padding: 30px;
            font-size: 16px;
            grid-column: 1 / -1;
        }

        /* ============================================================
           BOTÃO VOLTAR
        ============================================================ */
        .btn-voltar {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            margin-top: 10px;
            border: none;
            text-align: center;
        }

        .btn-voltar:hover {
            background: #2ecc71;
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(39, 174, 96, 0.4);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #3a5a3a;
        }

        /* ============================================================
           RESPONSIVO
        ============================================================ */
        @media (max-width: 768px) {
            .container { padding: 20px; }
            .perfil-header .avatar { width: 90px; height: 90px; }
            .perfil-header .nome { font-size: 22px; }
            .perfil-header .stats { gap: 15px; flex-wrap: wrap; }
            .medalhas-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
        }

        @media (max-width: 480px) {
            .container { padding: 15px; }
            .perfil-header .avatar { width: 70px; height: 70px; }
            .perfil-header .nome { font-size: 18px; }
            .medalhas-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
            .nav-top { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>

        // ============================================================
        // CONFIGURAÇÃO DAS RARIDADES
        // ============================================================
        const raridadesConfig = {
            comum: { label: '⚪ Comum', class: 'comum', ordem: 0 },
            incomum: { label: '🟢 Incomum', class: 'incomum', ordem: 1 },
            rara: { label: '🔵 Rara', class: 'rara', ordem: 2 },

            lendaria: { label: '🟡 Lendária', class: 'lendaria', ordem: 6 }
        };

        function getRaridadeInfo(raridade) {
            return raridadesConfig[raridade] || raridadesConfig.comum;
        }

        // ============================================================
        // FUNÇÕES
        // ============================================================
        function getUsuarioById(id) {
            return usuarios.find(u => u.id === parseInt(id));
        }

        function getMedalhaById(id) {
            return medalhas.find(m => m.id === id);
        }

        function calcularPontos(medalhasIds) {
            let total = 0;
            medalhasIds.forEach(id => {
                const medalha = getMedalhaById(id);
                if (medalha) total += medalha.pontos;
            });
            return total;
        }

        function renderizarPerfil() {
            const params = new URLSearchParams(window.location.search);
            const userId = params.get('id');

            if (!userId) {
                document.getElementById('perfilHeader').innerHTML = `
                    <div style="color: #e74c3c; padding: 30px; text-align: center; font-size: 18px;">
                        ⚠️ Usuário não encontrado. ID não fornecido.
                    </div>
                `;
                document.getElementById('medalhasGrid').innerHTML = '';
                return;
            }

            const user = getUsuarioById(userId);

            if (!user) {
                document.getElementById('perfilHeader').innerHTML = `
                    <div style="color: #e74c3c; padding: 30px; text-align: center; font-size: 18px;">
                        ⚠️ Usuário não encontrado. ID: ${userId}
                    </div>
                `;
                document.getElementById('medalhasGrid').innerHTML = '';
                return;
            }

            const totalPontos = calcularPontos(user.medalhas);
            const medalhasInfo = user.medalhas.map(id => getMedalhaById(id)).filter(m => m);

            // ===== CABEÇALHO DO PERFIL =====
            document.getElementById('perfilHeader').innerHTML = `
                <img src="${user.avatar}" alt="${user.nome}" class="avatar">
                <div class="nome">${user.nome}</div>
                <div class="descricao">${user.descricao}</div>
                <div class="stats">
                    <div class="stat">
                        <div class="value">${totalPontos}</div>
                        <div class="label">⭐ Pontos</div>
                    </div>
                    <div class="stat">
                        <div class="value">${user.medalhas.length}</div>
                        <div class="label">🏅 Medalhas</div>
                    </div>
                    <div class="stat">
                        <div class="value">#${usuarios.filter(u => calcularPontos(u.medalhas) > totalPontos).length + 1}</div>
                        <div class="label">📊 Rank</div>
                    </div>
                </div>
            `;

            // ===== MEDALHAS COM TARJAS DE RARIDADE =====
            const grid = document.getElementById('medalhasGrid');

            if (medalhasInfo.length === 0) {
                grid.innerHTML = `
                    <div class="sem-medalhas">
                        📭 Este caçador ainda não possui medalhas.
                    </div>
                `;
                return;
            }

            medalhasInfo.sort((a, b) => (b.pontos || 0) - (a.pontos || 0));

            let html = '';
            medalhasInfo.forEach(medalha => {
                const raridade = medalha.raridade || 'comum';
                const rarInfo = getRaridadeInfo(raridade);
                
                html += `
                    <div class="medalha-card raridade-${rarInfo.class}">
                        <div class="raridade-tarja"></div>
                        <img src="${medalha.imagem}" alt="${medalha.nome}" class="medalha-img">
                        <div class="medalha-nome">${medalha.nome}</div>
                        <div class="medalha-pontos">⭐ ${medalha.pontos || 0} pts</div>
                        <span class="raridade-tag">${rarInfo.label}</span>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        // ============================================================
        // INICIALIZAR
        // ============================================================
        renderizarPerfil();

        console.log('👤 Perfil carregado!');
        console.log(`📊 ${medalhas.length} medalhas disponíveis`);
        console.log(`👥 ${usuarios.length} usuários cadastrados`);
    </script>

</body>
</html>
