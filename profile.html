<style>

<!-- ============================================================
     JAVASCRIPT DO SISTEMA DE LOGIN (SEM HTML)
     ============================================================ -->
<script>
// ============================================================
// SISTEMA DE LOGIN - FUNÇÕES
// ============================================================

const ACCOUNTS_FOLDER = 'accounts';
const SESSION_KEY = 'user_sessao';
let usuarioLogado = null;

// ============================================================
// ABRIR/FECHAR LOGIN
// ============================================================
function abrirLogin() {
    const modal = document.getElementById('loginModal');
    if (modal) modal.classList.add('active');
    
    const msg = document.getElementById('loginMensagem');
    if (msg) {
        msg.textContent = '';
        msg.className = 'login-mensagem';
    }
    
    const nome = document.getElementById('loginNome');
    const senha = document.getElementById('loginSenha');
    if (nome) nome.value = '';
    if (senha) senha.value = '';
    
    setTimeout(() => {
        if (nome) nome.focus();
    }, 100);
}

function fecharLogin() {
    const modal = document.getElementById('loginModal');
    if (modal) modal.classList.remove('active');
}

// ============================================================
// ABRIR/FECHAR REGISTRO
// ============================================================
function abrirRegistro() {
    fecharLogin();
    const modal = document.getElementById('registroModal');
    if (modal) modal.classList.add('active');
    
    const msg = document.getElementById('regMensagem');
    if (msg) {
        msg.textContent = '';
        msg.className = 'login-mensagem';
    }
    
    const nome = document.getElementById('regNome');
    const senha = document.getElementById('regSenha');
    const senha2 = document.getElementById('regSenha2');
    if (nome) nome.value = '';
    if (senha) senha.value = '';
    if (senha2) senha2.value = '';
    
    setTimeout(() => {
        if (nome) nome.focus();
    }, 100);
}

function fecharRegistro() {
    const modal = document.getElementById('registroModal');
    if (modal) modal.classList.remove('active');
}

// ============================================================
// FECHAR MODAIS CLICANDO FORA
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    const loginModal = document.getElementById('loginModal');
    if (loginModal) {
        loginModal.addEventListener('click', function(e) {
            if (e.target === this) fecharLogin();
        });
    }
    const registroModal = document.getElementById('registroModal');
    if (registroModal) {
        registroModal.addEventListener('click', function(e) {
            if (e.target === this) fecharRegistro();
        });
    }
});

// ============================================================
// FAZER LOGIN
// ============================================================
async function fazerLogin() {
    const nomeEl = document.getElementById('loginNome');
    const senhaEl = document.getElementById('loginSenha');
    const msg = document.getElementById('loginMensagem');
    
    if (!nomeEl || !senhaEl) {
        if (msg) {
            msg.textContent = '❌ Erro no formulário';
            msg.className = 'login-mensagem erro';
        }
        return;
    }
    
    const nome = nomeEl.value.trim();
    const senha = senhaEl.value;
    
    if (!nome) {
        if (msg) {
            msg.textContent = '❌ Digite seu nome';
            msg.className = 'login-mensagem erro';
        }
        return;
    }
    if (!senha) {
        if (msg) {
            msg.textContent = '❌ Digite sua senha';
            msg.className = 'login-mensagem erro';
        }
        return;
    }
    
    if (msg) {
        msg.textContent = '⏳ Verificando...';
        msg.className = 'login-mensagem carregando';
    }
    
    try {
        // Verifica se GITHUB_REPO existe
        if (typeof GITHUB_REPO === 'undefined') {
            if (msg) {
                msg.textContent = '❌ Configuração do GitHub não encontrada';
                msg.className = 'login-mensagem erro';
            }
            return;
        }
        
        const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/${ACCOUNTS_FOLDER}/${nome}.json?ref=${GITHUB_BRANCH || 'main'}`;
        const response = await fetch(url);
        
        if (!response.ok) {
            if (msg) {
                msg.textContent = '❌ Usuário não encontrado';
                msg.className = 'login-mensagem erro';
            }
            return;
        }
        
        const data = await response.json();
        const conteudo = atob(data.content);
        const perfil = JSON.parse(conteudo);
        
        if (perfil.senha !== senha) {
            if (msg) {
                msg.textContent = '❌ Senha incorreta';
                msg.className = 'login-mensagem erro';
            }
            return;
        }
        
        // Login bem-sucedido
        usuarioLogado = {
            nome: perfil.nome,
            avatar: perfil.avatar || '👤'
        };
        localStorage.setItem(SESSION_KEY, JSON.stringify(usuarioLogado));
        atualizarInterface();
        
        // Carrega o progresso
        if (perfil.progress && Array.isArray(perfil.progress)) {
            if (typeof missions !== 'undefined' && perfil.progress.length === missions.length) {
                if (typeof checkedStates !== 'undefined') {
                    checkedStates = perfil.progress;
                    localStorage.setItem(STORAGE_KEY || 'mvm_progress', JSON.stringify(checkedStates));
                    if (typeof renderTable === 'function') renderTable();
                }
            }
        }
        
        fecharLogin();
        if (typeof showToast === 'function') {
            showToast(`✅ Bem-vindo, ${perfil.nome}!`);
        } else {
            alert(`✅ Bem-vindo, ${perfil.nome}!`);
        }
        
    } catch (error) {
        if (msg) {
            msg.textContent = '❌ Erro: ' + error.message;
            msg.className = 'login-mensagem erro';
        }
    }
}

// ============================================================
// FAZER REGISTRO (ENVIA DIRETO PARA O GITHUB)
// ============================================================
async function fazerRegistro() {
    const nomeEl = document.getElementById('regNome');
    const senhaEl = document.getElementById('regSenha');
    const senha2El = document.getElementById('regSenha2');
    const avatarEl = document.getElementById('regAvatar');
    const msg = document.getElementById('regMensagem');
    
    if (!nomeEl || !senhaEl || !senha2El || !msg) {
        console.error('Elementos de registro não encontrados');
        return;
    }
    
    const nome = nomeEl.value.trim();
    const senha = senhaEl.value;
    const senha2 = senha2El.value;
    const avatar = avatarEl ? avatarEl.value : '👤';
    
    msg.className = 'login-mensagem';
    
    // ===== VALIDAÇÕES =====
    if (!nome || nome.length < 3) {
        msg.textContent = '❌ O nome deve ter pelo menos 3 caracteres';
        msg.className = 'login-mensagem erro';
        return;
    }
    if (!senha || senha.length < 4) {
        msg.textContent = '❌ A senha deve ter pelo menos 4 caracteres';
        msg.className = 'login-mensagem erro';
        return;
    }
    if (senha !== senha2) {
        msg.textContent = '❌ As senhas não coincidem';
        msg.className = 'login-mensagem erro';
        return;
    }
    
    // ===== PEDIR TOKEN =====
    if (typeof GITHUB_TOKEN !== 'undefined' && !GITHUB_TOKEN) {
        const token = obterToken();
        if (!token) {
            msg.textContent = '❌ Token necessário para criar conta';
            msg.className = 'login-mensagem erro';
            return;
        }
        GITHUB_TOKEN = token;
    }
    
    msg.textContent = '⏳ Criando conta no GitHub...';
    msg.className = 'login-mensagem carregando';
    
    try {
        // 1. VERIFICA SE O USUÁRIO JÁ EXISTE
        const checkUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/${ACCOUNTS_FOLDER}/${nome}.json?ref=${GITHUB_BRANCH}`;
        const checkResponse = await fetch(checkUrl, {
            headers: {
                'Authorization': `token ${GITHUB_TOKEN}`
            }
        });
        
        if (checkResponse.ok) {
            msg.textContent = '❌ Este nome de usuário já existe!';
            msg.className = 'login-mensagem erro';
            return;
        }
        
        // 2. CRIA O PERFIL
        let progress = [];
        if (typeof checkedStates !== 'undefined') {
            progress = checkedStates;
        }
        
        const dados = {
            nome: nome,
            senha: senha,
            avatar: avatar,
            progress: progress,
            criadoEm: new Date().toISOString(),
            ultimoAcesso: new Date().toISOString(),
            totalMissions: typeof missions !== 'undefined' ? missions.length : 0
        };
        
        // Converte para Base64
        const json = JSON.stringify(dados, null, 2);
        const base64 = btoa(unescape(encodeURIComponent(json)));
        
        // 3. ENVIA PARA O GITHUB
        const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/${ACCOUNTS_FOLDER}/${nome}.json`;
        const body = {
            message: `📝 Criando conta: ${nome}`,
            content: base64,
            branch: GITHUB_BRANCH
        };
        
        const response = await fetch(url, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${GITHUB_TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(body)
        });
        
        if (!response.ok) {
            const erro = await response.json();
            throw new Error(erro.message || 'Erro ao enviar');
        }
        
        // 4. SUCESSO
        msg.textContent = `✅ Conta "${nome}" criada com sucesso!`;
        msg.className = 'login-mensagem sucesso';
        
        // Faz login automático
        usuarioLogado = {
            nome: nome,
            avatar: avatar || '👤'
        };
        localStorage.setItem(SESSION_KEY, JSON.stringify(usuarioLogado));
        atualizarInterface();
        
        setTimeout(() => {
            fecharRegistro();
            if (typeof showToast === 'function') {
                showToast(`✅ Bem-vindo, ${nome}!`);
            } else {
                alert(`✅ Bem-vindo, ${nome}!`);
            }
        }, 1500);
        
    } catch (error) {
        console.error('Erro ao criar conta:', error);
        msg.textContent = '❌ Erro: ' + error.message;
        msg.className = 'login-mensagem erro';
        
        // Se o token for inválido, limpa ele da sessão
        if (error.message.includes('401') || error.message.includes('403')) {
            sessionStorage.removeItem('github_token');
            if (typeof GITHUB_TOKEN !== 'undefined') GITHUB_TOKEN = '';
            msg.textContent = '❌ Token inválido! Clique em "Criar Conta" novamente.';
        }
    }
}

// ============================================================
// OBTER TOKEN (PEDE NA HORA)
// ============================================================
function obterToken() {
    let token = sessionStorage.getItem('github_token');
    if (!token) {
        token = prompt(
            '🔑 Digite seu token do GitHub:\n\n' +
            'Como criar:\n' +
            '1. Settings → Developer settings\n' +
            '2. Personal access tokens → Tokens (classic)\n' +
            '3. Generate new token\n' +
            '4. Marque a opção "repo"\n' +
            '5. Copie o token gerado'
        );
        if (token && token.trim() !== '') {
            token = token.trim();
            sessionStorage.setItem('github_token', token);
        }
    }
    return token;
}

// ============================================================
// LOGOUT
// ============================================================
function fazerLogout() {
    if (confirm('⚠️ Deseja realmente sair?')) {
        usuarioLogado = null;
        localStorage.removeItem(SESSION_KEY);
        atualizarInterface();
        if (typeof showToast === 'function') {
            showToast('👋 Você saiu da conta');
        }
    }
}

// ============================================================
// ATUALIZAR INTERFACE
// ============================================================
function atualizarInterface() {
    const avatarEl = document.getElementById('userAvatar');
    const nomeEl = document.getElementById('userName');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    
    if (usuarioLogado) {
        if (avatarEl) avatarEl.textContent = usuarioLogado.avatar || '👤';
        if (nomeEl) nomeEl.textContent = usuarioLogado.nome || 'Usuário';
        if (loginBtn) loginBtn.style.display = 'none';
        if (logoutBtn) logoutBtn.style.display = 'inline-block';
    } else {
        if (avatarEl) avatarEl.textContent = '👤';
        if (nomeEl) nomeEl.textContent = 'Desconectado';
        if (loginBtn) loginBtn.style.display = 'inline-block';
        if (logoutBtn) logoutBtn.style.display = 'none';
    }
}

// ============================================================
// CARREGAR SESSÃO SALVA
// ============================================================
function carregarSessao() {
    try {
        const salvo = localStorage.getItem(SESSION_KEY);
        if (salvo) {
            usuarioLogado = JSON.parse(salvo);
            atualizarInterface();
            return true;
        }
    } catch (e) {
        console.warn('Erro ao carregar sessão:', e);
    }
    return false;
}

// ============================================================
// LIMPAR TOKEN SALVO
// ============================================================
function limparToken() {
    if (confirm('⚠️ Tem certeza que deseja limpar o token salvo?')) {
        sessionStorage.removeItem('github_token');
        if (typeof GITHUB_TOKEN !== 'undefined') GITHUB_TOKEN = '';
        console.log('🔑 Token limpo com sucesso!');
        if (typeof showToast === 'function') {
            showToast('🔑 Token limpo!', 'info');
        } else {
            alert('🔑 Token limpo!');
        }
    }
}

// ============================================================
// INICIALIZAR
// ============================================================
// Só executa se não estiver sendo carregado pelo index.html
if (typeof window !== 'undefined' && !window._profileLoaded) {
    window._profileLoaded = true;
    carregarSessao();
    console.log('✅ Sistema de login carregado (profile.html)');
}
</script>
