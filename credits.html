            padding: 0;
            box-sizing: border-box;
        }

        /* =========================================================
           FUNDO PERSONALIZADO (ADICIONAR AQUI!)
        ============================================================ */

        :root {
            --fundo-imagem: url('images/backgrounds.png');
            --fundo-opacidade: 1;
        }

        body {
            padding: 20px;
            min-height: 100vh;
            position: relative;
            background: #1a2e1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-image: var(--fundo-imagem);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            opacity: var(--fundo-opacidade);
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #1a2e1a;
            opacity: 0.55;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #2a4a2a;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            border: 1px solid #3a5a3a;
        }

        /* ============================================================
           CABEÇALHO
        ============================================================ */
        .header {
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 2px solid #3a5a3a;
            margin-bottom: 25px;
        }

        .header .badge {
            display: inline-block;
            background: #ff6b81;
            color: white;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .header h1 {
            color: #f0f0f0;
            font-size: 28px;
            font-weight: 700;
        }

        .header h1 .highlight {
            color: #ff6b81;
        }

        .header .subtitle {
            color: #aaddaa;
            font-size: 14px;
            margin-top: 8px;
            opacity: 0.9;
        }

        /* ============================================================
           SEÇÕES
        ============================================================ */
        .section {
            margin-bottom: 30px;
        }

        .section-title {
            color: #f0f0f0;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #3a5a3a;
            padding-bottom: 10px;
        }

        .section-title .icon {
            font-size: 24px;
        }

        /* ============================================================
           CARD DE COLABORADOR
        ============================================================ */
        .colaborador-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .colaborador-card {
            background: #1a3a1a;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            border: 1px solid #3a5a3a;
            transition: all 0.3s ease;
        }

        .colaborador-card:hover {
            border-color: #4caf50;
            transform: translateY(-3px);
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.3);
        }

        .colaborador-card .avatar {
            display: block;
            margin: 0 auto 8px auto;
        }

        /* ===== AVATAR SOLTO (SEM BORDA) - PADRÃO ===== */
        .colaborador-card .avatar-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            display: block;
            margin: 0 auto 10px auto;
            /* SEM BORDA, SEM ARREDONDAMENTO */
        }

        /* ===== AVATAR REDONDO (COM BORDA) ===== */
        .colaborador-card .avatar-img.redondo {
            border-radius: 50%;
            border: 2px solid #4caf50;
            transition: all 0.3s ease;
        }

        /* ===== AVATAR QUADRADO (COM BORDA) ===== */
        .colaborador-card .avatar-img.quadrado {
            border-radius: 10px;
            border: 2px solid #4caf50;
            transition: all 0.3s ease;
        }

        .colaborador-card .avatar-img.grande {
            width: 100%;
            height: auto;
            max-width: 200px;
            border-radius: 10px;
            transition: all 0.3s ease;
            margin: 0 auto 10px auto;
        }
        
        .colaborador-card:hover .avatar-img.grande {
            border-color: #66bb6a;
            transform: scale(1.03);
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.3);
        }

        .colaborador-card:hover .avatar-img.redondo,
        .colaborador-card:hover .avatar-img.quadrado {
            border-color: #66bb6a;
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.3);
        }

        .colaborador-card .avatar-emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }

        .colaborador-card .nome {
            color: #f0f0f0;
            font-size: 16px;
            font-weight: 600;
        }

        .colaborador-card .funcao {
            color: #aaddaa;
            font-size: 13px;
            margin-top: 4px;
        }

        .colaborador-card .contribuicao {
            color: #b0d0b0;
            font-size: 12px;
            margin-top: 4px;
        }

        /* ============================================================
           BOTÕES SOCIAIS COM TEXTO COMPLETO
           ============================================================ */
         .social-buttons {
             display: flex;
             justify-content: center;
             align-items: center;
             gap: 6px;
             margin-top: 10px;
             flex-wrap: wrap;
         }
         
         .social-btn {
             display: inline-flex;
             align-items: center;
             justify-content: center;
             gap: 5px;
             padding: 4px 14px;
             border-radius: 6px;
             text-decoration: none;
             font-size: 11px;
             font-weight: 600;
             transition: all 0.3s ease;
             color: white;
             border: none;
             cursor: pointer;
             white-space: nowrap;
         }
         
         .social-btn:hover {
             transform: scale(1.05);
             filter: brightness(1.2);
         }
         
         /* ===== CORES DOS BOTÕES ===== */
         .social-btn.github { background: #333; }
         .social-btn.github:hover { background: #444; box-shadow: 0 0 20px rgba(51, 51, 51, 0.4); }
         
         .social-btn.youtube { background: #ff0000; }
         .social-btn.youtube:hover { background: #cc0000; box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); }
         
         .social-btn.twitter { background: #1da1f2; }
         .social-btn.twitter:hover { background: #1a8cd8; box-shadow: 0 0 20px rgba(29, 161, 242, 0.4); }
         
         .social-btn.discord { background: #5865f2; }
         .social-btn.discord:hover { background: #4752c4; box-shadow: 0 0 20px rgba(88, 101, 242, 0.4); }
         
         .social-btn.steam { background: #171a21; }
         .social-btn.steam:hover { background: #2a2f3a; box-shadow: 0 0 20px rgba(23, 26, 33, 0.4); }
         
         .social-btn.twitch { background: #9146ff; }
         .social-btn.twitch:hover { background: #7a3bcc; box-shadow: 0 0 20px rgba(145, 70, 255, 0.4); }
         
         .social-btn.website { background: #2a7de1; }
         .social-btn.website:hover { background: #1f6bc4; box-shadow: 0 0 20px rgba(42, 125, 225, 0.4); }

        /* ============================================================
           LISTA DE CONTRIBUIÇÕES
        ============================================================ */
        .contribuicao-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 14px;
            margin: 4px 0;
            background: #1a3a1a;
            border-radius: 8px;
            border-left: 3px solid #4caf50;
            transition: all 0.3s ease;
        }

        .contribuicao-item:hover {
            background: #2a4a2a;
            transform: translateX(5px);
        }

        .contribuicao-item .data {
            color: #88bb88;
            font-size: 12px;
            white-space: nowrap;
            min-width: 100px;
        }

        .contribuicao-item .texto {
            color: #d0d0d0;
            font-size: 14px;
        }

        .contribuicao-item .texto strong {
            color: #f0f0f0;
        }

        /* ============================================================
           TAGS DE TECNOLOGIAS
        ============================================================ */
        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tech-tag {
            background: #1a3a1a;
            color: #aaddaa;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #3a5a3a;
        }

        .tech-tag:hover {
            border-color: #4caf50;
            background: #2a4a2a;
        }

        /* ============================================================
           VERSÃO E TIMESTAMP
        ============================================================ */
        .versao-info {
            text-align: center;
            color: #88bb88;
            font-size: 13px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #3a5a3a;
        }

        .versao-info strong {
            color: #f0f0f0;
        }

        .timestamp {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            color: #66aa66;
        }

        /* ============================================================
           BOTÃO VOLTAR
        ============================================================ */
        .btn-voltar {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            margin-top: 10px;
            border: none;
            text-align: center;
        }

        .btn-voltar:hover {
            background: #66bb6a;
            transform: scale(1.02);
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.4);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
        }

        /* ============================================================
           RESPONSIVO
        ============================================================ */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .colaborador-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }

            .colaborador-card .avatar-img {
                width: 60px;
                height: 60px;
            }

            .contribuicao-item {
                flex-direction: column;
                gap: 4px;
            }

            .contribuicao-item .data {
                min-width: unset;
                font-size: 11px;
            }

            .btn-voltar {
                display: block;
            }
        }

           BORDA ARCO-ÍRIS ANIMADA (VISÍVEL)
           ============================================================ */
        
        /* ===== CARD COM BORDA ARCO-ÍRIS ===== */
        .colaborador-card.rainbow-border {
            position: relative;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            transition: all 0.3s ease;
            
            /* ===== BORDA ARCO-ÍRIS VISÍVEL ===== */
            border: 2px solid transparent;
            background: linear-gradient(#1a3a1a, #1a3a1a) padding-box,
                        linear-gradient(to right,
                          rgba(255, 0, 0, 0.5),      /* vermelho - 50% opaco */
                          rgba(255, 165, 0, 0.5),    /* laranja - 50% opaco */
                          rgba(255, 255, 0, 0.5),    /* amarelo - 50% opaco */
                          rgba(0, 255, 0, 0.5),      /* verde - 50% opaco */
                          rgba(0, 0, 255, 0.5),      /* azul - 50% opaco */
                          rgba(138, 43, 226, 0.5),   /* roxo - 50% opaco */
                          rgba(255, 0, 255, 0.5),    /* magenta - 50% opaco */
                          rgba(255, 0, 0, 0.5)       /* vermelho - 50% opaco */
                        ) border-box;
            background-size: 100% 100%, 300% 100%;
            animation: rainbowBorderMove 3s linear infinite;
            
        }
        
        .colaborador-card.rainbow-border:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 30px rgba(255, 0, 255, 0.3);
        }
        
        /* ============================================================
           CONTRIBUIÇÃO COM BORDA ARCO-ÍRIS (CORRIGIDA)
           ============================================================ */
        .contribuicao-item.rainbow-border {
            position: relative;
            background: #1a3a1a;
            border-radius: 8px;
            padding: 10px 14px;
            margin: 4px 0;
            transition: all 0.3s ease;
            
            /* ===== BORDA ARCO-ÍRIS ===== */
            border-left: 3px solid transparent;
            background: linear-gradient(#1a3a1a, #1a3a1a) padding-box,
                        linear-gradient(to bottom,
                            rgba(255, 0, 0, 0.8),
                            rgba(255, 165, 0, 0.8),
                            rgba(255, 255, 0, 0.8),
                            rgba(0, 255, 0, 0.8),
                            rgba(0, 0, 255, 0.8),
                            rgba(138, 43, 226, 0.8),
                            rgba(255, 0, 255, 0.8),
                            rgba(255, 0, 0, 0.8)
                        ) border-box;
            background-size: 100% 100%, 100% 300%;
            animation: rainbowBorderVertical 3s linear infinite;
        }
        
        /* ===== HOVER CORRIGIDO - MANTÉM A BORDA ARCO-ÍRIS ===== */
        .contribuicao-item.rainbow-border:hover {
            background: linear-gradient(#2a4a2a, #2a4a2a) padding-box,
                        linear-gradient(to bottom,
                            rgba(255, 0, 0, 0.8),
                            rgba(255, 165, 0, 0.8),
                            rgba(255, 255, 0, 0.8),
                            rgba(0, 255, 0, 0.8),
                            rgba(0, 0, 255, 0.8),
                            rgba(138, 43, 226, 0.8),
                            rgba(255, 0, 255, 0.8),
                            rgba(255, 0, 0, 0.8)
                        ) border-box;
            transform: translateX(5px);
            background-size: 100% 100%, 100% 300%;
            animation: rainbowBorderVertical 3s linear infinite;
        }
        
        /* ===== KEYFRAMES ===== */
        @keyframes rainbowBorderMove {
            0% { background-position: 0% 0%, 0% 50%; }
            100% { background-position: 0% 0%, 300% 50%; }
        }
        
        @keyframes rainbowBorderVertical {
            0% { background-position: 0% 0%, 50% 0%; }
            100% { background-position: 0% 0%, 50% 300%; }
        }
    </style>
</head>

                    texto: "Adicionado <strong>Lightbar</strong> com borda arco-íris animada"
                },
                {
                    data: "26/07/2026",
                    texto: "Criada página de <strong>Eventos</strong> com status automático"
                },
                // ============================================================
                // ADICIONE NOVAS CONTRIBUIÇÕES AQUI:
                // ============================================================
                // {
                //     data: "DD/MM/AAAA",
                //     texto: "Descrição da contribuição"
                // },
            ],

            // ===== TECNOLOGIAS =====
            tecnologias: [
                "HTML5",
                "CSS3",
                "JavaScript",
                "GitHub Pages",
                "GitHub API",
                "LocalStorage",
                "JSON",
                "DeepSeek AI",
            ],
        };

        // ============================================================
        // FUNÇÃO PARA FORMATAR DATA/HORA (TIMESTAMP)
        // ============================================================
        function formatarTimestamp(data) {
            const dias = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
            const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 
                          'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
            
            const diaSemana = dias[data.getDay()];
            const dia = String(data.getDate()).padStart(2, '0');
            const mes = meses[data.getMonth()];
            const ano = data.getFullYear();
            const horas = String(data.getHours()).padStart(2, '0');
            const minutos = String(data.getMinutes()).padStart(2, '0');
            
            return `${diaSemana}, ${dia} de ${mes} de ${ano} às ${horas}:${minutos}`;
        }

       // ============================================================
       // RENDERIZAR COLABORADORES (COM BOTÕES DE TEXTO COMPLETO)
       // ============================================================
       function renderizarColaboradores() {
           const grid = document.getElementById('colaboradoresGrid');
           
           if (config.colaboradores.length === 0) {
               grid.innerHTML = `
                   <div style="color: #88bb88; text-align: center; padding: 20px; grid-column: 1 / -1;">
                       📭 Nenhum colaborador cadastrado
                   </div>
               `;
               return;
           }
       
           let html = '';
           config.colaboradores.forEach(colab => {
               let avatarHtml = '';
               
               const isEmoji = colab.avatar && !colab.avatar.includes('/') && !colab.avatar.includes('http') && !colab.avatar.includes('.');
               
               if (isEmoji) {
                   avatarHtml = `<span class="avatar-emoji">${colab.avatar}</span>`;
               } else {
                   let classe = 'avatar-img';
                   
                   if (colab.formato === 'redondo') {
                       classe += ' redondo';
                   } else if (colab.formato === 'quadrado') {
                       classe += ' quadrado';
                   }
                   
                   if (colab.tamanho === 'grande') {
                       classe += ' grande';
                   }
                   
                   avatarHtml = `<img src="${colab.avatar}" class="${classe}" alt="${colab.nome}">`;
               }
               
               // ===== VERIFICA SE TEM BORDA ARCO-ÍRIS =====
               const borderClass = colab.rainbowBorder === true ? 'rainbow-border' : '';
               
               // ===== BOTÕES SOCIAIS COM TEXTO COMPLETO =====
               let socialHtml = '';
               if (colab.social) {
                   const socialIcons = {
                       github: { icon: '🐙', label: 'GitHub' },
                       youtube: { icon: '▶️', label: 'YouTube' },
                       twitter: { icon: '🐦', label: 'Twitter' },
                       discord: { icon: '💬', label: 'Discord' },
                       steam: { icon: '🎮', label: 'Steam' },
                       twitch: { icon: '📺', label: 'Twitch' },
                       website: { icon: '🌐', label: 'Site' }
                   };
                   
                   let buttonsHtml = '';
                   for (const [key, url] of Object.entries(colab.social)) {
                       if (url && url.trim() !== '') {
                           const info = socialIcons[key] || { icon: '🔗', label: key };
                           buttonsHtml += `
                               <a href="${url}" target="_blank" class="social-btn ${key}">
                                   ${info.icon} ${info.label}
                               </a>
                           `;
                       }
                   }
                   
                   if (buttonsHtml) {
                       socialHtml = `<div class="social-buttons">${buttonsHtml}</div>`;
                   }
               }
               
               html += `
                   <div class="colaborador-card ${borderClass}">
                       ${avatarHtml}
                       <div class="nome">${colab.nome}</div>
                       <div class="funcao">${colab.funcao}</div>
                       <div class="contribuicao">${colab.contribuicao}</div>
                       ${socialHtml}
                   </div>
               `;
           });
       
           grid.innerHTML = html;
        }   
        // ============================================================
        // RENDERIZAR CONTRIBUIÇÕES
        // ============================================================
        function renderizarContribuicoes() {
            const list = document.getElementById('contribuicoesList');
        
            if (config.contribuicoes.length === 0) {
                list.innerHTML = `
                    <div style="color: #88bb88; text-align: center; padding: 20px;">
                        📭 Nenhuma contribuição registrada
                    </div>
                `;
                return;
            }
        
            let html = '';
            config.contribuicoes.forEach(item => {
                // ===== VERIFICA SE TEM BORDA ARCO-ÍRIS =====
                const borderClass = item.rainbowBorder === true ? 'rainbow-border' : '';
                
                html += `
                    <div class="contribuicao-item ${borderClass}">
                        <span class="data">📅 ${item.data}</span>
                        <span class="texto">${item.texto}</span>
                    </div>
                `;
            });
        
            list.innerHTML = html;
        }
        // ============================================================
        // RENDERIZAR TECNOLOGIAS
        // ============================================================
        function renderizarTecnologias() {
            const container = document.getElementById('techTags');

            if (config.tecnologias.length === 0) {
                container.innerHTML = `
                    <span style="color: #88bb88; font-size: 13px;">Nenhuma tecnologia listada</span>
                `;
                return;
            }

            let html = '';
            config.tecnologias.forEach(tech => {
                html += `<span class="tech-tag">${tech}</span>`;
            });

            container.innerHTML = html;
        }

        // ============================================================
        // RENDERIZAR VERSÃO COM TIMESTAMP
        // ============================================================
        function renderizarVersao() {
            const el = document.getElementById('versaoInfo');
            
            // Data/hora atual
            const agora = new Date();
            const timestamp = formatarTimestamp(agora);
            
            el.innerHTML = `
                📦 Versão <strong>${config.versao}</strong> · 
                🕐 Atualizado em <strong>${timestamp}</strong>
                <span class="timestamp">🧡 Feito com amor pela comunidade, e algumas coisas foram feitas por IA</span>
            `;
        }

        // ============================================================
        // INICIALIZAR
        // ============================================================
        renderizarColaboradores();
        renderizarContribuicoes();
        renderizarTecnologias();
        renderizarVersao();

        console.log('✅ Página de créditos carregada!');
        console.log(`📦 ${config.versao}`);
        console.log(`🤝 ${config.colaboradores.length} colaboradores`);
        console.log(`📝 ${config.contribuicoes.length} contribuições`);
        console.log(`🕐 Timestamp: ${formatarTimestamp(new Date())}`);
    </script>
